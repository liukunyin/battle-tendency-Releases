name: Publish Web game
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release containing the Web zip
        required: true
        default: v0.3
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Download release Web export
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          mkdir dist
          gh release download "$RELEASE_TAG" --repo "$RELEASE_REPO" --pattern '*-web.zip' --pattern SHA256SUMS.txt --dir dist
          cd dist
          sha256sum --check --ignore-missing SHA256SUMS.txt
          unzip -q '*-web.zip' -d ../_site
          test -f ../_site/index.html
          test -f ../_site/sw.js
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
