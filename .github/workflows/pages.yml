name: Publish Web game
on:
  workflow_dispatch:
    inputs:
      base_run:
        description: Successful Pages run containing the deployed game files
        required: true
        default: '38139850069'
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/checkout@v4
      - name: Restore deployed game and apply Web fix
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_RUN: ${{ inputs.base_run }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          mkdir _site dist
          gh run download "$BASE_RUN" --repo "$RELEASE_REPO" --name github-pages --dir dist
          tar -xf dist/artifact.tar -C _site
          cp web/sw.js _site/sw.js
          test -f _site/index.html
          test -f _site/sw.js
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
