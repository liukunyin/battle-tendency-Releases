name: Publish Web game
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Check Web build
        run: |
          test -f web/index.html
          test -f web/sw.js
          test -f web/packs/manifest.json
      - name: Assemble split main PCK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          chunks_dir = Path("web/.main-pck-chunks")
          chunks = sorted(chunks_dir.glob("*.part"))
          if not chunks:
              raise SystemExit("No split main PCK chunks found")
          target = Path("web/bt-f780d4401a29db1664f9.pck")
          with target.open("wb") as out:
              for chunk in chunks:
                  with chunk.open("rb") as src:
                      while data := src.read(1024 * 1024):
                          out.write(data)
          for chunk in chunks:
              chunk.unlink()
          chunks_dir.rmdir()
          import hashlib
          source = Path("web/.pck-bt-6b25cc5a8efcb4bec4e7")
          target = Path("web/bt-6b25cc5a8efcb4bec4e7.pck")
          with target.open("wb") as out:
              for part in sorted(source.glob("*.part")):
                  out.write(part.read_bytes())
                  part.unlink()
          source.rmdir()
          assert hashlib.sha256(target.read_bytes()).hexdigest() == "c29f7ecdd7e0a7bceb0c044e03671d3150fc319a9ab677982e164521649bd024"
          import hashlib
          source = Path("web/.pck-bt-863aa06571f67f299854")
          target = Path("web/bt-863aa06571f67f299854.pck")
          with target.open("wb") as out:
              for part in sorted(source.glob("*.part")):
                  out.write(part.read_bytes())
                  part.unlink()
          source.rmdir()
          assert hashlib.sha256(target.read_bytes()).hexdigest() == "b9e35777024faff40e958749334a8e43eccc683555c41309cbb1c2319ad721cb"
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
