name: Publish Web game
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Check Web build
        run: |
          test -f web/index.html
          test -f web/sw.js
          test -f web/packs/manifest.json
      - name: Assemble split main PCK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          chunks_dir = Path("web/.main-pck-chunks")
          chunks = sorted(chunks_dir.glob("*.part"))
          if not chunks:
              raise SystemExit("No split main PCK chunks found")
          target = Path("web/bt-f780d4401a29db1664f9.pck")
          with target.open("wb") as out:
              for chunk in chunks:
                  with chunk.open("rb") as src:
                      while data := src.read(1024 * 1024):
                          out.write(data)
          for chunk in chunks:
              chunk.unlink()
          chunks_dir.rmdir()
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
