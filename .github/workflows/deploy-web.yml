name: Deploy Web to GitHub Pages
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag containing battle-tendency-web.zip
        required: true
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download tested Web build
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'battle-tendency-web.zip*'
          if [ ! -f battle-tendency-web.zip ]; then
            cat battle-tendency-web.zip.part* > battle-tendency-web.zip
          fi
          mkdir web
          unzip -q battle-tendency-web.zip -d web
          test -f web/index.html
          test -f web/index.pck
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
