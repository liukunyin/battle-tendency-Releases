<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>battle-tendency</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #08070f;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

window.battleTendencyCacheReady = (async () => {
    if (!('serviceWorker' in navigator) || !window.isSecureContext) return;
    const controlled = !!navigator.serviceWorker.controller;
    try {
        await navigator.serviceWorker.register('./sw.js', {scope: './', updateViaCache: 'none'});
        if (controlled) return;
        await navigator.serviceWorker.ready;
        if (!navigator.serviceWorker.controller) {
            await new Promise(resolve => navigator.serviceWorker.addEventListener('controllerchange', resolve, {once: true}));
        }
    } catch (error) {
        // Online gameplay still works if storage/registration is unavailable.
        console.warn('Game resource cache unavailable:', error);
    }
})();
// Do not block online startup indefinitely on a browser storage failure.
window.battleTendencyCacheReady = Promise.race([
    window.battleTendencyCacheReady,
    new Promise(resolve => setTimeout(resolve, 10000)),
]);

// Mobile number fields for Godot Web. Shared by the main Web and Toy builds.
// A real DOM input receives the tap itself, so mobile browsers open the keyboard;
// Godot only reports the field layout and receives the typed value.
(() => {
    const style = document.createElement('style');
    style.textContent = `.web-number-input{position:fixed;z-index:4;box-sizing:border-box;margin:0;padding:0 4px;border-radius:3px;border-style:solid;outline:none;text-align:center;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-weight:700;font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none;touch-action:manipulation}`;
    document.head.appendChild(style);
    const inputs = new Map();
    let blocked = false, frozen = null, shift = 0, thawTimer = 0;

    function place(item) {
        const canvas = document.getElementById('canvas');
        if (!canvas) return;
        const rect = canvas.getBoundingClientRect(), p = item.data, n = item.node, s = n.style;
        const focused = document.activeElement === n;
        const shown = (p.visible || focused) && !blocked;
        s.display = shown ? 'block' : 'none';
        if (!shown) { if (focused) n.blur(); return; }
        s.left = rect.left + p.x * rect.width + 'px'; s.top = rect.top + p.y * rect.height + 'px';
        s.width = p.w * rect.width + 'px'; s.height = p.h * rect.height + 'px';
        s.fontSize = p.font * rect.height + 'px'; s.color = p.color;
        s.background = p.bg; s.borderColor = focused ? p.focusBorder : p.border;
        s.borderWidth = Math.max(1, p.borderWidth * rect.height) + 'px';
        s.clipPath = `inset(${p.clip.map((v, i) => v * (i % 2 ? rect.width : rect.height) + 'px').join(' ')})`;
        if (!focused && n.value !== p.text) n.value = p.text;
    }
    const placeAll = () => inputs.forEach(place);

    // The soft keyboard shrinks the window and Godot would relayout to it. While a
    // field is edited, Godot keeps reading the pre-keyboard size and the canvas
    // only slides up far enough to keep that field above the keyboard.
    function freeze() {
        clearTimeout(thawTimer);
        if (frozen) return;
        frozen = {};
        for (const key of ['innerWidth', 'innerHeight']) {
            const value = window[key], own = Object.getOwnPropertyDescriptor(window, key);
            try { Object.defineProperty(window, key, {configurable: true, get: () => value}); frozen[key] = own || null; }
            catch (_) {}
        }
    }
    function thaw() {
        clearTimeout(thawTimer);
        if (!frozen) return;
        for (const key of Object.keys(frozen)) {
            if (frozen[key]) Object.defineProperty(window, key, frozen[key]); else delete window[key];
        }
        frozen = null; setShift(0);
    }
    function setShift(next) {
        const canvas = document.getElementById('canvas');
        if (!canvas || next === shift) return;
        shift = next; canvas.style.transform = shift ? `translateY(${-shift}px)` : '';
        placeAll();
        // DOM overlays positioned from the canvas rect (e.g. Toy system text) follow.
        window.dispatchEvent(new Event('webcanvasshift'));
    }
    const editing = () => document.activeElement?.classList.contains('web-number-input');
    function keepVisible() {
        if (!frozen || !editing()) return;
        if (window.scrollY || window.scrollX) window.scrollTo(0, 0);
        const view = window.visualViewport;
        const bottom = view ? view.offsetTop + view.height : window.innerHeight;
        const base = document.activeElement.getBoundingClientRect().bottom + shift;
        setShift(Math.max(0, Math.round(base + 12 - bottom)));
    }
    window.visualViewport?.addEventListener('resize', keepVisible);
    window.visualViewport?.addEventListener('scroll', keepVisible);
    window.addEventListener('resize', () => { keepVisible(); placeAll(); });

    window.webNumberInput = {
        set(id, json, cb) {
            let item = inputs.get(id);
            if (!item) {
                const node = document.createElement('input');
                node.className = 'web-number-input';
                node.type = 'text'; node.inputMode = 'decimal'; node.autocomplete = 'off'; node.spellcheck = false;
                item = {node, cb};
                node.addEventListener('pointerdown', freeze);
                node.addEventListener('focus', () => { freeze(); node.value = item.data.edit; node.select(); place(item); keepVisible(); });
                node.addEventListener('input', () => item.cb?.('input', node.value));
                node.addEventListener('blur', () => {
                    item.cb?.('commit', node.value); place(item);
                    // Wait for the keyboard to close so Godot never sees the shrunken size.
                    clearTimeout(thawTimer);
                    thawTimer = setTimeout(() => { if (!editing()) thaw(); }, 600);
                });
                node.addEventListener('keydown', e => { if (e.key === 'Enter') node.blur(); e.stopPropagation(); });
                node.addEventListener('keyup', e => e.stopPropagation());
                inputs.set(id, item); document.body.appendChild(node);
            }
            if (cb) item.cb = cb;
            item.data = JSON.parse(json);
            place(item);
        },
        remove(id) {
            const item = inputs.get(id);
            if (!item) return;
            item.cb = null; item.node.remove(); inputs.delete(id);
            if (!inputs.size) thaw();
        },
        // HTML dialogs drawn above the canvas hide the fields underneath them.
        setBlocked(value) { blocked = !!value; placeAll(); }
    };
})();

#bt-boot-mark::before {content:'';position:absolute;inset:0;border:1px solid #e7c66d25;border-radius:50%;background:radial-gradient(circle,#b38b2420,transparent 68%);z-index:-1}
#bt-boot-mark::after {content:'';position:absolute;inset:-3%;border:2px solid transparent;border-top-color:#e7c66d99;border-bottom-color:#e7c66d33;border-radius:50%;animation:bt-orbit 7s linear infinite}
.bt-boot-battle {font-size:clamp(32px,8vw,66px);font-weight:900;font-style:italic;letter-spacing:-.055em;color:#f6f3e9;text-shadow:3px 3px #8e7130;line-height:1.05}
.bt-boot-tendency {font-size:clamp(20px,5vw,38px);font-weight:900;font-style:italic;color:#e7c66d;letter-spacing:.01em;margin-top:12px}
.bt-boot-dots {display:flex;gap:12px;position:absolute;bottom:16%}
.bt-boot-dots i {width:5px;height:5px;background:#e7c66d;transform:rotate(45deg);animation:bt-pulse 1.5s ease-in-out infinite}
.bt-boot-dots i:nth-child(2){animation-delay:.2s}.bt-boot-dots i:nth-child(3){animation-delay:.4s}
#status-progress {position:absolute!important;left:50%!important;right:auto!important;bottom:8%!important;transform:translateX(-50%);width:min(72vw,400px)!important;height:4px!important;border:0;border-radius:4px;overflow:hidden;background:#e7c66d18;appearance:none;accent-color:#e7c66d}
#status-progress::-webkit-progress-bar {background:#e7c66d18;border-radius:4px}
#status-progress::-webkit-progress-value {background:linear-gradient(90deg,#96702b,#f1d88c);border-radius:4px}
#status[data-bt-waiting="true"][data-bt-stage="download"] #status-progress::-webkit-progress-value {background:linear-gradient(90deg,#96702b,#f1d88c,#96702b);background-size:200% 100%;animation:bt-flow 1.7s linear infinite}
#status-progress::-moz-progress-bar {background:#e7c66d;border-radius:4px}
#status[data-bt-stage="prepare"] #status-progress {background:linear-gradient(90deg,#e7c66d12 15%,#e7c66daa 50%,#e7c66d12 85%);background-size:200% 100%;animation:bt-flow 1.7s linear infinite}
#status[data-bt-stage="prepare"] #status-progress::-webkit-progress-bar {background:transparent}
#status[data-bt-stage="prepare"] #status-progress::-webkit-progress-value {background:transparent}
#status[data-bt-stage="prepare"] #status-progress::-moz-progress-bar {background:transparent}
#bt-loading-flow {display:none;position:absolute;left:50%;bottom:8%;transform:translateX(-50%);width:min(72vw,400px);height:4px;overflow:hidden;border-radius:4px;background:#e7c66d18}
#status[data-bt-stage="prepare"] #status-progress {visibility:hidden}
#status[data-bt-stage="prepare"] #bt-loading-flow {display:block}

        mark.classList.add('bt-art-ready');
        const image = document.createElement('img');
        image.id = 'bt-loading-art';
        image.alt = '';
        // Toy may sit in an iframe/panel whose aspect differs from the browser.
        // Follow the actual loading surface and keep progress/animation intact.
        const select = () => {
            const bounds = overlay.getBoundingClientRect();
            if (bounds.width <= 0 || bounds.height <= 0) return;
            const orientation = bounds.width < bounds.height ? 'portrait' : 'landscape';
            if (overlay.dataset.btArtworkOrientation === orientation) return;
            overlay.dataset.btArtworkOrientation = orientation;
            image.src = art[orientation];
        };
        select();
        // Removed with the loading overlay; no retained resize listeners.
        const observer = new ResizeObserver(select);
        observer.observe(overlay);
        const cleanup = new MutationObserver(() => {
            if (!overlay.isConnected) { observer.disconnect(); cleanup.disconnect(); }

        cleanup.observe(overlay.parentNode, {childList:true});

    flow.id = 'bt-loading-flow';
    flow.setAttribute('aria-hidden', 'true');
    flow.innerHTML = '<i></i>';

    // Keep both progress modes above its actual box, including embedded resizes.
    const notice = document.getElementById('status-notice');
    const positionProgress = () => {
        const bounds = overlay.getBoundingClientRect();
        let bottom = bounds.height * 0.08;
        if (notice && notice.getClientRects().length && notice.textContent.trim()) {
            bottom = Math.max(bottom, bounds.bottom - notice.getBoundingClientRect().top + 12);
        }
        overlay.style.setProperty('--bt-progress-bottom', Math.ceil(bottom) + 'px');
    };
    const layoutObserver = new ResizeObserver(positionProgress);
    layoutObserver.observe(overlay);
    if (notice) layoutObserver.observe(notice);
    const layoutCleanup = new MutationObserver(() => {
        if (!overlay.isConnected) { layoutObserver.disconnect(); layoutCleanup.disconnect(); }
    });
    layoutCleanup.observe(overlay.parentNode, {childList:true});

// Shared startup byte formatting. Counts decoded resource bytes, including cache reads.
(function () {
    window.battleTendencyFormatResourceBytes = function (current, total, pattern) {
        if (!Number.isFinite(current) || !Number.isFinite(total) || total <= 0) return '';
        const loaded = Math.min(total, Math.max(0, current));
        return (pattern || '{loaded} MB / {total} MB')
            .replace('{loaded}', (loaded / 1000000).toFixed(1))
            .replace('{total}', (total / 1000000).toFixed(1));
    };
    // Keep transfer and local preparation independent. Unknown work has no fake percentage.
    window.battleTendencySetLoadStage = function (stage, current, total) {
        const text = window.battleTendencyLoadStageText;
        if (!text) return;
        let line = document.getElementById('status-load-stage');
        const overlay = document.getElementById('status');
        if (!overlay) return;
        overlay.dataset.btStage = stage === 'download' ? 'download' : 'prepare';
        const completed = document.getElementById('status-resource-bytes');
        if (stage !== 'download' && completed) completed.style.display = 'none';
        if (!line) {
            line = document.createElement('div');
            line.id = 'status-load-stage';
            line.style.cssText = 'position:absolute;left:16px;right:16px;bottom:calc(10% + 50px);text-align:center;color:#e0e0e0;font:14px/1.4 Arial,sans-serif;pointer-events:none;z-index:2';
            overlay.appendChild(line);
        }
        const bytes = current < total ? window.battleTendencyFormatResourceBytes(current, total) : '';
        if (stage === 'unpack' && current >= total) stage = 'prepare';
        line.textContent = (text[stage] || stage) + (bytes ? ' · ' + bytes : '');
        const bar = document.getElementById('status-progress');
        if (bar && stage !== 'download') {
            if (Number.isFinite(total) && total > 0) { bar.max = total; bar.value = current; }
            else if (bar.removeAttribute) bar.removeAttribute('value');
        }
    };
    let lastCurrent = -1, lastTotal = -1, waitingTimer;
